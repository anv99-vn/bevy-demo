[package]
name = "bevy-demo"
version = "0.1.0"
edition = "2021"

[lib]
name = "bevy_demo_app"
path = "src/lib.rs"
crate-type = [
    "staticlib",
    "cdylib", # needed for Android
    "rlib",   # rlib needed for running locally
]

[[bin]]
name = "bevy-demo"
path = "src/main.rs"

[dependencies]
bevy = "0.15"

# Enable a small amount of optimization in the dev profile for smoother gameplay
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (including Bevy) in dev builds
[profile.dev.package."*"]
opt-level = 3