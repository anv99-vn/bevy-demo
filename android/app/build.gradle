plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.bevy_demo'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.bevy_demo"
        minSdk 31
        targetSdk 33
        versionCode 1
        versionName "1.0"
        // set up targets
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        prefab true
    }
    sourceSets {
        main {
            assets.srcDirs += files('../../../../assets')
        }
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.games.activity
}
